name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, linux-x64, osx-x64, osx-arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained single file
        run: |
          dotnet publish ./YourProject/YourProject.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -o publish/${{ matrix.rid }}

      - name: Rename output for clarity
        run: |
          cd publish/${{ matrix.rid }}
          ext=""
          if [[ "${{ matrix.rid }}" == win-* ]]; then ext=".exe"; fi
          mv YourProject$ext ../../YourApp-${{ matrix.rid }}$ext

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: YourApp-${{ matrix.rid }}
          path: YourApp-${{ matrix.rid }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
